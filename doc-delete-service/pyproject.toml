[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-delete-worker"
version = "1.0.0"
description = "One-document OpenSearch and PostgreSQL sentence deletion worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "opensearch-py>=2.8,<4",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "requests-aws4auth>=1.3,<2",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
  "watchfiles>=1.3,<2",
]

[tool.setuptools.packages.find]
include = ["doc_delete_completed*", "ta_db_connection*", "ta_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests/opensearch"]
pythonpath = ["."]
addopts = "--cov=doc_delete_completed.opensearch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"ta_utils/aws/opensearch/OpenSearchClient.py" = ["N999"]
"ta_utils/aws/sqs/AwsSQS.py" = ["N999"]
"ta_utils/logger/CustomLogger.py" = ["N999"]
"ta_utils/vault/VaultSecrets.py" = ["N999"]

