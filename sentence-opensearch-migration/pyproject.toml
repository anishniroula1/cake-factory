[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentence-opensearch-migration"
version = "0.1.0"
description = "Migrate S3-listed TSP documents from an external API into OpenSearch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opensearch-py>=2.8,<4",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["sentence_migration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
