services:
  postgres:
    image: postgres:16-alpine
    # Match the CPU and memory size of the db.m6i.xlarge test environment.
    cpus: 4
    mem_limit: 16g
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    # Containers use Docker's service name and internal PostgreSQL port.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - .:/app
    command:
      - uvicorn
      - bucket_demo.main:app
      - --reload
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
