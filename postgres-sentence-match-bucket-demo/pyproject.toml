[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-sentence-match-bucket-demo"
version = "0.1.0"
description = "FastAPI and PostgreSQL demo for bucketed bidirectional sentence matches"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["bucket_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
